name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: 'Read-only production metadata on a reviewed codex branch; no release jobs'
        type: boolean
        default: false
      skip_unit_tests:
        description: 'Skip unit tests (backend + frontend)'
        type: boolean
        default: false
      skip_e2e:
        description: 'Skip E2E tests (backend + frontend)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/washflow
  DOCKER_IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/washflow-frontend

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Lint (backend + frontend in parallel)
  # ──────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    if: ${{ !inputs.diagnostic_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx prisma generate

      - name: Lint
        run: pnpm lint

  frontend-lint:
    name: Frontend Lint
    if: ${{ !inputs.diagnostic_only }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ──────────────────────────────────────────────────────────────────
  # 2. Unit tests (backend + frontend in parallel)
  # ──────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.diagnostic_only && !inputs.skip_unit_tests }}
    needs: [backend-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx prisma generate

      - name: Run unit tests with coverage
        run: pnpm test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 7

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.diagnostic_only && !inputs.skip_unit_tests }}
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # ──────────────────────────────────────────────────────────────────
  # 3. E2E tests (backend + frontend, needs full stack)
  # ──────────────────────────────────────────────────────────────────
  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    # Override implicit success() only for unit jobs deliberately skipped by input.
    if: |
      always() && !cancelled() && !inputs.diagnostic_only && !inputs.skip_e2e &&
      needs.backend-lint.result == 'success' &&
      needs.frontend-lint.result == 'success' &&
      (needs.backend-test.result == 'success' ||
        (inputs.skip_unit_tests && needs.backend-test.result == 'skipped'))
    needs: [backend-lint, frontend-lint, backend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: washflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/washflow_test'
      REDIS_URL: 'redis://localhost:6379'
      JWT_ACCESS_SECRET: 'ci-test-access-secret-minimum-32-chars!'
      JWT_REFRESH_SECRET: 'ci-test-refresh-secret-minimum-32-chars!'
      JWT_ACCESS_EXPIRATION: '15m'
      JWT_REFRESH_EXPIRATION: '7d'
      NODE_ENV: 'test'
      CORS_ORIGINS: '*'
      RESEND_API_KEY: ''
      FRONTEND_URL: 'http://localhost:5173'
      PAYMENTS_ENABLED: 'true'
      # Synthetic sandbox credentials keep payment UI/guard coverage enabled.
      PADDLE_API_KEY: 'ci-synthetic-paddle-api-key'
      PADDLE_CLIENT_TOKEN: 'ci-synthetic-paddle-client-token'
      PADDLE_WEBHOOK_SECRET: 'ci-synthetic-paddle-webhook-secret'
      PADDLE_SANDBOX: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed
        continue-on-error: true

      - name: Run E2E tests
        run: pnpm test:e2e --runInBand --forceExit

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && !inputs.diagnostic_only && !inputs.skip_e2e &&
      needs.backend-lint.result == 'success' &&
      needs.frontend-lint.result == 'success' &&
      (needs.backend-test.result == 'success' ||
        (inputs.skip_unit_tests && needs.backend-test.result == 'skipped')) &&
      (needs.frontend-test.result == 'success' ||
        (inputs.skip_unit_tests && needs.frontend-test.result == 'skipped'))
    needs: [backend-lint, frontend-lint, backend-test, frontend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: washflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/washflow_e2e'
      REDIS_URL: 'redis://localhost:6379'
      JWT_ACCESS_SECRET: 'ci-test-access-secret-minimum-32-chars!'
      JWT_REFRESH_SECRET: 'ci-test-refresh-secret-minimum-32-chars!'
      JWT_ACCESS_EXPIRATION: '15m'
      JWT_REFRESH_EXPIRATION: '7d'
      NODE_ENV: 'test'
      CORS_ORIGINS: 'http://localhost:5173'
      PORT: '3003'
      RESEND_API_KEY: ''
      FRONTEND_URL: 'http://localhost:5173'
      PAYMENTS_ENABLED: 'true'
      # Synthetic sandbox credentials keep payment UI/guard coverage enabled.
      PADDLE_API_KEY: 'ci-synthetic-paddle-api-key'
      PADDLE_CLIENT_TOKEN: 'ci-synthetic-paddle-client-token'
      PADDLE_WEBHOOK_SECRET: 'ci-synthetic-paddle-webhook-secret'
      PADDLE_SANDBOX: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: npx prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        run: npx prisma db seed
        continue-on-error: true

      - name: Build backend
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start backend
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          echo $! > backend.pid
          echo "Backend PID: $(cat backend.pid)"

      - name: Wait for backend to be ready
        run: |
          PID=$(cat backend.pid)
          for i in $(seq 1 30); do
            if curl -s http://localhost:3003/api/v1 > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Backend process died!"
              echo "--- Backend log ---"
              cat backend.log || true
              exit 1
            fi
            echo "Waiting... attempt $i"
            sleep 2
          done

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list
        working-directory: frontend
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # 4. Build & push Docker image (only on main)
  # ──────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: |
      always() && !cancelled() && !inputs.diagnostic_only &&
      github.ref == 'refs/heads/main' &&
      needs.backend-lint.result == 'success' &&
      needs.frontend-lint.result == 'success' &&
      (needs.backend-test.result == 'success' ||
        (inputs.skip_unit_tests && needs.backend-test.result == 'skipped')) &&
      (needs.frontend-test.result == 'success' ||
        (inputs.skip_unit_tests && needs.frontend-test.result == 'skipped')) &&
      (needs.backend-e2e.result == 'success' ||
        (inputs.skip_e2e && needs.backend-e2e.result == 'skipped')) &&
      (needs.frontend-e2e.result == 'success' ||
        (inputs.skip_e2e && needs.frontend-e2e.result == 'skipped'))
    needs:
      - backend-lint
      - frontend-lint
      - backend-test
      - frontend-test
      - backend-e2e
      - frontend-e2e
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend Docker metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_FRONTEND }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_PADDLE_SANDBOX=false

  # ──────────────────────────────────────────────────────────────────
  # 5. Deploy to Hetzner (only on main)
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    if: |
      always() && !inputs.diagnostic_only &&
      github.ref == 'refs/heads/main' &&
      needs.build-and-push.result == 'success'
    needs: [build-and-push]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment tooling
        env:
          WASHFLOW_DEPLOY_DOCKER_TEST: '1'
        run: python3 -B -m unittest discover -s test/deploy -p 'test_*.py' -v

      - name: Build expected migration and schema metadata
        run: python3 -B scripts/deploy/expected.py --output "$RUNNER_TEMP/washflow-expected.json"

      - name: Setup existing deployment SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/washflow-deploy-key"
          # Existing TOFU baseline: no pinned host-key secret is available. Strict
          # verification is required on both subsequent SSH calls; never bypass it.
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Paired backup and app-only SHA deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 -B scripts/deploy/transport.py \
            --host "$DEPLOY_HOST" --user "$DEPLOY_USER" \
            --key "$RUNNER_TEMP/washflow-deploy-key" \
            --expected "$RUNNER_TEMP/washflow-expected.json" \
            --backend "$DOCKER_IMAGE:$RELEASE_SHA" \
            --frontend "$DOCKER_IMAGE_FRONTEND:$RELEASE_SHA" \
            --revision "$RELEASE_SHA" --attempt "$RELEASE_ATTEMPT"

      - name: Cleanup ephemeral deployment key
        if: always()
        run: rm -f "$RUNNER_TEMP/washflow-deploy-key"

  diagnose:
    name: Read-only deployment diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_only && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup existing diagnostic SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/washflow-diagnostic-key"
          # Same documented TOFU baseline; subsequent SSH requires strict verification.
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect selected metadata without remote writes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          python3 -B scripts/deploy/diagnose.py --host "$DEPLOY_HOST" --user "$DEPLOY_USER" \
            --key "$RUNNER_TEMP/washflow-diagnostic-key"
      - name: Cleanup ephemeral diagnostic key
        if: always()
        run: rm -f "$RUNNER_TEMP/washflow-diagnostic-key"
